name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install scipy==1.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/betweenness.test.mjs
      - run: node --test tests/scoring.test.mjs
      - run: node --test tests/treemap-layout.test.mjs
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
