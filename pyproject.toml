[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "utecvis"
version = "0.1.0"
description = "Extracción reproducible y visualización de redes académicas de UTEC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "Flask>=3.1,<4",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
analysis = ["networkx>=3.4,<4"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
utecvis-etl = "extraccion_datos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["extraccion_datos*", "app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
